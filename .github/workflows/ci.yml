name: CI

# Off: this runs by hand only. Every run was failing and a wall of red says nothing about
# the change in front of it. The tests themselves are the ones you run locally (see
# CONTRIBUTING.md); put `push:` and `pull_request:` back here to turn the runner on again.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  core:
    name: core tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # The core (model, theme, adapters) has no dependencies and imports without Blender.
      - run: python tests/test_core.py
      - run: python tests/test_signals.py
      - run: python tests/test_ledger.py
      - run: python tests/test_usage.py
      - run: python tests/test_herdr.py
      - run: python tests/test_cli_version.py
      - run: python tests/test_mosaic.py
