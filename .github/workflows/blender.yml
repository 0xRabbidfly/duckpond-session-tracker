name: Blender headless

# The load-bearing tests need bpy: the motion smoothness contract, the visual smoke test
# and the camera director. They run in background Blender (no GPU needed; the smoke test
# falls back to Workbench when EEVEE cannot render).
on:
  push:
    branches: [main]
    paths:
      - "duck_pond/**"
      - "tests/**"
      - "fixtures/**"
      - ".github/workflows/blender.yml"
  pull_request:
    paths:
      - "duck_pond/**"
      - "tests/**"
      - "fixtures/**"
      - ".github/workflows/blender.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  BLENDER_VERSION: "5.2.1"

jobs:
  headless:
    name: headless tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache Blender
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          series="${BLENDER_VERSION%.*}"
          url="https://download.blender.org/release/Blender${series}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          mkdir -p ~/blender
          curl -fsSL "$url" | tar -xJ -C ~/blender --strip-components=1

      - name: System libraries for background Blender
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libglu1-mesa libsm6 libxkbcommon0

      - name: Motion contract
        run: ~/blender/blender -b --python tests/headless_motion.py

      - name: Director and world continuity
        run: ~/blender/blender -b --python tests/headless_director.py

      - name: Visual smoke test
        run: ~/blender/blender -b --python tests/headless_smoke.py

      - name: Upload renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-renders
          path: out/*.png
          if-no-files-found: ignore
